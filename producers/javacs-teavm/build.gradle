plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}

repositories { mavenCentral() }

sourceSets {
    teavmDeterminism {
        java.srcDirs = ['teavm-determinism']
    }
    teavmDeterminismTest {
        java.srcDirs = ['teavm-determinism-tests']
        compileClasspath += sourceSets.teavmDeterminism.output
        runtimeClasspath = sourceSets.teavmDeterminism.output + runtimeClasspath
    }
}

configurations.teavmDeterminismTestImplementation.extendsFrom(configurations.teavmDeterminismCompileOnly)


dependencies {
    // Compiler-only copies of two 0.16.0 classes; reuse already authenticated daemon dependencies.
    teavmDeterminismCompileOnly('org.teavm:teavm-core:0.16.0') { transitive = false }
    teavmDeterminismCompileOnly('org.teavm:teavm-relocated-libs-hppc:0.16.0') { transitive = false }

    compileOnly 'com.google.code.gson:gson:2.8.5'
    implementation 'com.google.protobuf:protobuf-java:3.9.1'
    implementation 'org.teavm:teavm-jso:0.16.0'
    implementation 'org.teavm:teavm-jso-apis:0.16.0'
    implementation 'org.teavm:teavm-core:0.16.0'
    implementation files('../../.cache/javacs-teavm/jdk-compiler.jar', '../../.cache/javacs-teavm/java-compiler.jar',
        '../../.cache/javacs-teavm/jdk-support.jar')
}

sourceSets.main {
    java.srcDirs = ['java', '../../.cache/javacs-teavm/browser-source']
    resources.srcDirs = ['resources']
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['--add-exports', 'jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
}

teavm {
    all {
        mainClass = 'org.javacs.BrowserJavacs'
        optimization = org.teavm.gradle.api.OptimizationLevel.NONE
    }
    wasmGC {
        outOfProcess = true
        processMemory = 4096
        modularRuntime = true
        strict = true
        obfuscated = true
    }
    js {
        outOfProcess = true
        processMemory = 4096
        moduleType = org.teavm.gradle.api.JSModuleType.ES2015
    }
}

// Identity-hashed dependency domains and discovery-ordered class tags otherwise change Wasm
// constants between clean JVM runs. Keep the overrides ahead of teavm-core in the compiler
// daemon only, and fail on a version change until these exact upstream copies are reviewed.
def producerInputs = new groovy.json.JsonSlurper().parse(file('inputs.lock.json'))
if (producerInputs.teavm.version != '0.16.0') {
    throw new GradleException('Review teavm-determinism against the new TeaVM version')
}

tasks.register('verifyTeaVmDeterminism', JavaExec) {
    classpath = sourceSets.teavmDeterminismTest.runtimeClasspath
    mainClass = 'org.teavm.dependency.DeterminismTest'
}

tasks.named('generateWasmGC') {
    dependsOn tasks.named('verifyTeaVmDeterminism')
    def upstreamClasspath = new ArrayList<Object>(daemonClasspath.from)
    daemonClasspath.setFrom(sourceSets.teavmDeterminism.output, upstreamClasspath)
}
