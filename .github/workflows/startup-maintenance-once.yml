name: Startup maintenance (isolated branch)
on:
  push:
    branches: [fix/refresh-runtime-support-matrix]
    paths: [.github/workflows/startup-maintenance-once.yml]
permissions:
  contents: write
concurrency:
  group: startup-maintenance-once
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'seo-rii/wasm-idle' && github.ref == 'refs/heads/fix/refresh-runtime-support-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and verify the support matrix
        run: |
          pnpm run support:matrix
          pnpm run check:support-matrix
          git diff --check
          git diff --stat
          git diff -- README.md > /tmp/support-matrix.patch
      - name: Commit only the generated README to this fix branch
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/fix/refresh-runtime-support-matrix
          actual=$(git ls-remote origin "$target" | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- README.md
            git commit -m 'docs: regenerate runtime support matrix after 1.0.1 release'
            git push origin "HEAD:$target"
          fi
      - name: Archive the generated diff and reviewed source inputs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          roots = ['README.md', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'scripts', 'packages/core', 'packages/llvm-core', 'packages/terminal', 'src/lib/playground', 'src/routes', '.github/workflows']
          names = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots]).decode().split('\0')
          with tarfile.open('/tmp/startup-review-sources.tar.gz', 'w:gz') as out:
              for name in names:
                  p = pathlib.Path(name)
                  if name and p.is_file() and not p.is_symlink() and p.suffix in {'.md', '.ts', '.mjs', '.js', '.json', '.yaml', '.yml', '.svelte'} and p.stat().st_size <= 2 * 1024 * 1024:
                      out.add(p, arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-maintenance-review
          retention-days: 1
          path: |
            /tmp/support-matrix.patch
            /tmp/startup-review-sources.tar.gz
