name: Runtime performance review workspace
on:
  push:
    branches: [chore/runtime-perf-workspace-20260927]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            static/wasm-typescript
            producers/wasm-php
      - name: Read current Go regression suite
        run: |
          git fetch --depth=1 origin a1640827e6e3cf4a0b78639563bf26dda028f743
          mkdir -p /tmp/review/runtimes/wasm-go/src
          git show a1640827e6e3cf4a0b78639563bf26dda028f743:runtimes/wasm-go/src/tool-runtime.startup.test.ts > /tmp/review/runtimes/wasm-go/src/tool-runtime.startup.test.ts
          cp -r static producers /tmp/review/
          tar -C /tmp/review -czf /tmp/runtime-review-extra.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-review-extra
          path: /tmp/runtime-review-extra.tar.gz
          retention-days: 1
          compression-level: 0
