name: Rust sealed runtime distribution check
on:
  push:
    branches: [chore/runtime-perf-workspace-20260927]
permissions:
  contents: write
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-perf-patches
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct the receipt-verified logical distribution view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/runtime-perf-patches/final-rust.mjs');s=p.read_text()
          old=" if(!target||target.delivery.encoding!==entry.delivery.encoding||target.storage.sha256!==entry.storage.sha256)throw Error('Unexpected explicit/published storage conversion: '+entry.path);"
          new=" if(!target)throw Error('Missing explicit module: '+entry.path);\n const converted=target.delivery.encoding===entry.delivery.encoding?storage:target.delivery.encoding==='identity'&&entry.delivery.encoding==='gzip'?gunzipSync(storage):null;\n if(!converted||converted.length!==target.storage.bytes||hash(converted)!==target.storage.sha256)throw Error('Explicit module receipt mismatch: '+entry.path);"
          assert old in s;s=s.replace(old,new)
          assert 'import {readFile,writeFile,mkdir,cp}' in s
          s=s.replace('import {readFile,writeFile,mkdir,cp}','import {readFile,writeFile,mkdir,cp,rm}')
          assert 'await writeFile(out,storage)' in s
          s=s.replace('await writeFile(out,storage)',"await writeFile(out,converted); if(entry.delivery.storagePath===target.delivery.storagePath)throw Error('Unexpected shared storage path'); await rm(path.join(explicit,entry.delivery.storagePath))")
          p.write_text(s)
          PY
      - name: Verify source, tests and generated distribution
        shell: bash
        run: bash .github/runtime-perf-patches/final-rust.sh 2>&1 | tee /tmp/final-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-rust-validation
          path: /tmp/final-validation.log
          retention-days: 1
