name: LLDB browser integration

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: '29 19 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lldb-browser-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    product-lldb-wamr:
        runs-on: ubuntu-latest
        timeout-minutes: 150
        env:
            WASM_IDLE_STRICT_CSP: '1'
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Download pinned Clang browser assets
              run: pnpm run prepare:test-assets -- clang
            - name: Prepare pinned LLDB and WAMR browser release
              run: pnpm run prepare:wasm-debug-release
            - name: Build debugger consumer dependencies
              run: pnpm run build:publish-deps
            - name: Verify bundled debugger manifest receipt
              run: pnpm vitest run src/lib/playground/lldbManifestReceipt.test.ts
            - name: Enforce synced static asset budgets
              run: pnpm run check:asset-sizes
            - if: github.event_name != 'schedule'
              run: pnpm run test:browser:debug:lldb
            - name: Run the 100-relaunch LLDB soak
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              env:
                  WASM_IDLE_DEBUG_BROWSER_CASES: c-relaunch
                  WASM_IDLE_DEBUG_RELAUNCH_COUNT: 100
                  WASM_IDLE_DEBUG_BROWSER_TEST_TIMEOUT_MS: 7200000
              run: pnpm run test:browser:debug:lldb
