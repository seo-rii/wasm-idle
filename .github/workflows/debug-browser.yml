name: LLDB browser integration

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lldb-browser-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    product-lldb-wamr:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Download pinned Clang browser assets
              env:
                  WASM_IDLE_ASSET_BASE_URL: https://seorii.page/wasm-idle
              run: |
                  mkdir -p static/clang/bin
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_IDLE_ASSET_BASE_URL/clang/bin/clang.wasm.gz" --output static/clang/bin/clang.wasm.gz
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_IDLE_ASSET_BASE_URL/clang/bin/lld.wasm.gz" --output static/clang/bin/lld.wasm.gz
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_IDLE_ASSET_BASE_URL/clang/bin/memfs.wasm.gz" --output static/clang/bin/memfs.wasm.gz
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_IDLE_ASSET_BASE_URL/clang/bin/sysroot.tar.gz" --output static/clang/bin/sysroot.tar.gz
                  sha256sum --check <<<"b1174438d9a67b7ff11e623541b9a0572c024a9e798084b9b021dd9da2da0874  static/clang/bin/clang.wasm.gz"
                  sha256sum --check <<<"f842a9b5df3c6d326f0260bfd313c11c2e22bc8b8ae0387deede9a4af55779cd  static/clang/bin/lld.wasm.gz"
                  sha256sum --check <<<"d86f141eacd58a93511fbfb7c4e81d498eb7106a8a57df1bea7d33df3ce1f403  static/clang/bin/memfs.wasm.gz"
                  sha256sum --check <<<"68437624a81c465b93895615e7afd3f235ff256de17dc1927b124e783614e3e4  static/clang/bin/sysroot.tar.gz"
            - name: Download pinned LLDB and WAMR browser assets
              env:
                  WASM_LLVM_DEBUG_RELEASE_URL: https://raw.githubusercontent.com/seo-rii/wasm-llvm/9f61a243b00d056fdffe8266092ddfa4824e6f51/artifacts/runtime-source
              run: |
                  mkdir -p static/wasm-debug/debug
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/runtime-manifest.v2.json" --output static/wasm-debug/runtime-manifest.v2.json
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/lldb-web-dap.js" --output static/wasm-debug/debug/lldb-web-dap.js
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/lldb-web-dap.wasm" --output static/wasm-debug/debug/lldb-web-dap.wasm
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/lldb-web-dap.pthread.mjs" --output static/wasm-debug/debug/lldb-web-dap.pthread.mjs
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/wamr-debug.js" --output static/wasm-debug/debug/wamr-debug.js
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/wamr-debug.wasm" --output static/wasm-debug/debug/wamr-debug.wasm
                  curl --fail --location --retry 3 --header "Cookie: dev_bypass_waf=seorii_bypass_token_is_this" "$WASM_LLVM_DEBUG_RELEASE_URL/debug/wamr-debug.worker.mjs" --output static/wasm-debug/debug/wamr-debug.worker.mjs
                  sha256sum --check <<<"4d4e41f4fdbdfa619fbb098f511f2ebfcd75782e6792173e4871edd8695ec703  static/wasm-debug/runtime-manifest.v2.json"
                  sha256sum --check <<<"6b0e5f45487e004d27a90fa267da5fd041ca451ff7f513048456b76888515b6c  static/wasm-debug/debug/lldb-web-dap.js"
                  sha256sum --check <<<"f725266503568c94fdbb2c40dcc49f7956a6f0b3c838bf4809e4da14c2d33e7c  static/wasm-debug/debug/lldb-web-dap.wasm"
                  sha256sum --check <<<"d40975277aa0c98c6570f9a35d52ab9be475ded4e7a4796fc6d0f8f314c9652d  static/wasm-debug/debug/lldb-web-dap.pthread.mjs"
                  sha256sum --check <<<"084183134678e0ebbe1852fd6481bcb78222eaf06eae6bc5996003e66b050b2a  static/wasm-debug/debug/wamr-debug.js"
                  sha256sum --check <<<"e3c848b676cbc65b9014d19a3b36f480f7989309ce2e2385fcbeafa75240d338  static/wasm-debug/debug/wamr-debug.wasm"
                  sha256sum --check <<<"9d804f26275dcb13dd0427e4b2406576d950d685738f0d0e1add34394ab5622f  static/wasm-debug/debug/wamr-debug.worker.mjs"
            - run: pnpm run test:browser:debug:lldb
