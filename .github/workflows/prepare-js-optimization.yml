name: Build and verify split JavaScript runtime
on:
  push:
    branches: [perf/javascript-swc-split]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/javascript-swc-split
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply focused producer and consumer changes
        run: python3 .github/workflows/patch-javascript.py
      - name: Build and test the actual JS and TypeScript bundles
        run: |
          pnpm --dir runtimes/wasm-typescript run build
          pnpm --dir runtimes/wasm-typescript run check
          pnpm --dir runtimes/wasm-typescript run test
      - name: Sync and compress only the two JavaScript-family runtime entries
        run: |
          node scripts/sync-wasm-typescript.mjs
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path('static/compressed-runtime-assets.v1.json')
          manifest = json.loads(p.read_text())
          for name in ['index.js', 'javascript.js']:
              logical = 'wasm-typescript/' + name
              source = Path('static') / logical
              data = source.read_bytes()
              source.with_suffix(source.suffix + '.gz').write_bytes(gzip.compress(data, compresslevel=9, mtime=0))
              source.unlink()
              if logical not in manifest['assets']: manifest['assets'].append(logical)
              manifest['sizes'][logical] = len(data)
              print(logical, 'logical bytes', len(data), 'gzip bytes', (Path('static') / (logical + '.gz')).stat().st_size)
          manifest['assets'].sort()
          manifest['sizes'] = dict(sorted(manifest['sizes'].items()))
          p.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          node scripts/sync-wasm-typescript.mjs --verify
      - name: Run consumer integrity and lifecycle tests
        run: |
          pnpm exec svelte-kit sync
          pnpm exec vitest run src/lib/sync-wasm-typescript.test.ts src/lib/playground/typescript.test.ts src/lib/playground/assets.test.ts src/lib/playground/applicationAssets.test.ts
      - name: Commit validated changes on the feature branch
        run: |
          git diff --check
          git add runtimes/wasm-typescript/scripts/build.mjs runtimes/wasm-typescript/scripts/provenance.mjs scripts/sync-wasm-typescript.mjs src/lib/playground/assets.ts src/lib/playground/applicationAssets.ts src/lib/playground/typescript.ts src/lib/playground/wasmTypeScriptVersion.ts src/lib/sync-wasm-typescript.test.ts static/wasm-typescript static/compressed-runtime-assets.v1.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf(javascript): ship an independently verified SWC-free runtime entry'
            git push origin HEAD:refs/heads/perf/javascript-swc-split
          fi
