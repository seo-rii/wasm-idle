name: Runtime performance experiment audit

on:
  pull_request:
    paths:
      - 'scripts/performance/**'
      - 'docs/performance/**'
      - '.github/workflows/runtime-performance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/performance/*.test.mjs
      - name: Record reproducible source snapshot
        run: |
          mkdir -p performance-audit
          git rev-parse HEAD > performance-audit/revision.txt
          node --version > performance-audit/node-version.txt
          git archive --format=tar HEAD packages src scripts docs .github package.json pnpm-lock.yaml > performance-audit/source.tar
          sha256sum performance-audit/source.tar > performance-audit/source.sha256
          printf '%s\n' 'No compiler build, Python profile build, browser measurement or performance promotion was performed by this audit job.' > performance-audit/NOT-A-BENCHMARK.txt
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-evidence-tools
          path: performance-audit/
          retention-days: 7
          if-no-files-found: error

  # Temporary series evidence: read exact sources and existing CI results only.
  # Never check out or execute another PR, change a ref, deploy, or promote a result.
  series-ci-evidence:
    if: github.repository == 'seo-rii/wasm-idle' && github.event_name == 'pull_request' && github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture exact revisions and CI failure logs without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const repo = 'seo-rii/wasm-idle';
          const root = 'series-evidence';
          fs.mkdirSync(root, { recursive: true });
          const api = async (path, text = false) => {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(`GitHub ${path}: HTTP ${response.status}`);
            return text ? response.text() : response.json();
          };
          const report = [];
          for (let number = 68; number <= 76; number++) {
            const pr = await api(`pulls/${number}`);
            if (pr.head.repo?.full_name !== repo || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              throw new Error(`Unexpected source repository or revision for PR ${number}`);
            }
            const dir = `${root}/pr-${number}`;
            fs.mkdirSync(dir);
            const metadata = {
              number, url: pr.html_url, title: pr.title, body: pr.body, state: pr.state,
              draft: pr.draft, head: pr.head.ref, sha: pr.head.sha, base: pr.base.sha,
              capturedAt: new Date().toISOString(), runs: []
            };
            execFileSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', pr.head.sha], { stdio: 'inherit' });
            const names = execFileSync('git', ['ls-tree', '--name-only', pr.head.sha], { encoding: 'utf8' }).trim().split('\n');
            const selected = names.filter(name => ['packages', 'src', 'scripts', 'docs', '.github', 'AGENTS.md'].includes(name) || /^(package\.json|pnpm.*\.ya?ml|.*config\.[cm]?[jt]s|tsconfig.*\.json|\.npmrc|\.prettier.*|\.gitignore)$/.test(name));
            const fd = fs.openSync(`${dir}/source.tar`, 'w');
            try { execFileSync('git', ['archive', '--format=tar', pr.head.sha, ...selected], { stdio: ['ignore', fd, 'inherit'] }); }
            finally { fs.closeSync(fd); }
            metadata.sourceSha256 = createHash('sha256').update(fs.readFileSync(`${dir}/source.tar`)).digest('hex');
            const runs = await api(`actions/runs?event=pull_request&head_sha=${pr.head.sha}&per_page=30`);
            for (const run of runs.workflow_runs) {
              const jobs = await api(`actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
              const entry = { id: run.id, name: run.name, url: run.html_url, status: run.status, conclusion: run.conclusion, jobs: jobs.jobs, jobsTruncated: jobs.total_count > jobs.jobs.length };
              metadata.runs.push(entry);
              for (const job of jobs.jobs.filter(job => job.conclusion === 'failure')) {
                try { fs.writeFileSync(`${dir}/job-${job.id}.log`, await api(`actions/jobs/${job.id}/logs`, true)); }
                catch (error) { entry.logError = String(error); }
              }
            }
            fs.writeFileSync(`${dir}/metadata.json`, JSON.stringify(metadata, null, 2));
            report.push(metadata);
          }
          fs.writeFileSync(`${root}/index.json`, JSON.stringify(report, null, 2));
          fs.writeFileSync(`${root}/README.txt`, 'Read-only source and prior CI evidence. No retrieved candidate code was executed. Pending/skipped/failed jobs remain explicitly recorded; no speedup or acceptance is inferred. Authentication credentials are not archived.\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-series-source-and-ci
          path: series-evidence/
          retention-days: 3
          if-no-files-found: error
