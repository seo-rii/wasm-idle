name: Verify PHP startup in real browser workers
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: write
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned runtime, exercise both engines, and publish
        shell: bash
        run: bash .github/runtime-followup/publish-php.sh 2>&1 | tee /tmp/php-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-browser-validation
          path: /tmp/php-validation.log
          retention-days: 1
