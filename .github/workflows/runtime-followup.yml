name: Pinned .NET reference-registration runtime build
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.314'
      - name: Build and validate against the existing runtime version
        shell: bash
        run: bash .github/runtime-followup/dotnet-build.sh 2>&1 | tee /tmp/dotnet-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-reference-runtime
          path: |
            /tmp/dotnet-registered-runtime.tar.gz
            /tmp/dotnet-followup-tracked.patch
            /tmp/dotnet-validation.log
          retention-days: 1
          compression-level: 0
