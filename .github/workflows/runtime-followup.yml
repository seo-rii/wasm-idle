name: Java and Rust verified runtime preparation
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        change: [java, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and publish focused runtime change
        shell: bash
        run: bash .github/runtime-followup/publish-${{ matrix.change }}.sh 2>&1 | tee /tmp/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: followup-${{ matrix.change }}-validation
          path: /tmp/validation.log
          retention-days: 1
