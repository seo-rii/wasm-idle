name: Publish tested .NET reference registration
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: write
  actions: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-reference-runtime
          run-id: 36311848343
          github-token: ${{ github.token }}
          path: /tmp/built-runtime
      - name: Browser verification and canonical distribution publication
        shell: bash
        run: bash .github/runtime-followup/publish-dotnet.sh 2>&1 | tee /tmp/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-reference-browser-validation
          path: /tmp/validation.log
          retention-days: 1
