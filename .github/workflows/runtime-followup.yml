name: Ruby split profile and Rust module-cache validation
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        change: [ruby, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust sync dependency
        if: matrix.change == 'rust'
        run: npm install --prefix /tmp/tools --ignore-scripts --no-audit --no-fund prettier@3.8.3
      - name: Validate source and publish canonical runtime assets
        shell: bash
        run: bash .github/runtime-followup/publish-${{ matrix.change }}.sh 2>&1 | tee /tmp/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: followup-${{ matrix.change }}-validation
          path: /tmp/validation.log
          retention-days: 1
