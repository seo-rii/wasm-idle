name: Runtime continuation browser validation
on:
  push:
    branches: [chore/runtime-followup-20260927]
permissions:
  contents: read
jobs:
  dotnet:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-followup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-reference-runtime
          run-id: 36311848343
          github-token: ${{ github.token }}
          path: /tmp/built-runtime
      - name: Validate in the actual sidecar worker and publish
        shell: bash
        run: bash .github/runtime-followup/continue-dotnet.sh 2>&1 | tee /tmp/dotnet-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-sidecar-validation
          path: /tmp/dotnet-validation.log
          retention-days: 1
  php-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve exactly pinned PHP producer packages
        run: |
          mkdir -p /tmp/php-tools
          printf '{"private":true,"type":"module"}' > /tmp/php-tools/package.json
          cd /tmp/php-tools
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund @php-wasm/universal@3.1.34 @php-wasm/web-8-4@3.1.34 vite@8.0.8 esbuild@0.28.0 playwright-core@1.59.1
          tar -C /tmp/php-tools -czf /tmp/php-producer-tools.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: php-producer-tools
          path: /tmp/php-producer-tools.tar.gz
          compression-level: 0
          retention-days: 1
