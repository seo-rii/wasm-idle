name: Validate and build Go module cache
on:
  push:
    branches: [perf/go-compiled-module-cache]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/go-compiled-module-cache
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter wasm-go...
      - name: Keep native startup scheduling tests independent of a warm module cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtimes/wasm-go/test/tool-startup.test.ts')
          s = p.read_text()
          if "vi.stubGlobal('crypto', undefined)" not in s:
              s = s.replace('afterEach, describe', 'afterEach, beforeEach, describe', 1)
              old = 'afterEach(() => vi.restoreAllMocks());'
              assert s.count(old) == 1
              s = s.replace(old, "// Dedicated module-cache tests exercise the cached path; these tests exercise cold startup.\nbeforeEach(() => vi.stubGlobal('crypto', undefined));\nafterEach(() => { vi.restoreAllMocks(); vi.unstubAllGlobals(); });")
              p.write_text(s)
          PY
      - run: pnpm --dir runtimes/wasm-go run check
      - run: pnpm --dir runtimes/wasm-go run test
      - name: Build and execute real Go compiler probes
        run: |
          pnpm --dir runtimes/wasm-go run build
          cp -a static/wasm-go/runtime runtimes/wasm-go/dist/runtime
          pnpm --dir runtimes/wasm-go run probe:runtime
          node scripts/sync-wasm-go.mjs
      - name: Commit validated feature changes only
        run: |
          git diff --check
          git add runtimes/wasm-go/test/tool-startup.test.ts static/wasm-go src/lib/playground/wasmGoVersion.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(go): validate cached modules with the current startup tests and runtime probes'
            git push origin HEAD:refs/heads/perf/go-compiled-module-cache
          fi
