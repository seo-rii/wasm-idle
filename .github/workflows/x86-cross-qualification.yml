name: Linux x86-64 cross compilation

on:
    pull_request:
        paths:
            - 'packages/core/**'
            - 'packages/gcc/**'
            - 'packages/llvm-core/**'
            - 'scripts/verify-x86-cross-*.mjs'
            - 'scripts/rust-browser-probe-lib.mjs'
            - 'scripts/browser-progress-probe.mjs'
            - 'scripts/browser-test-cookies.mjs'
            - 'scripts/compile-runtime-asset-lock-module.mjs'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - 'patches/**'
            - '.github/workflows/x86-cross-qualification.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: x86-qualification-${{ github.ref }}
    cancel-in-progress: true

jobs:
    chromium-linux:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Check out the qualified producer inputs
              uses: actions/checkout@v4
              with:
                  repository: seo-rii/wasm-llvm
                  ref: ed4adc4f7409f5166265f7875d02eae73ff7a021
                  path: x86-producer
                  sparse-checkout: |
                      test/fixtures/x86-cross
                      producer/gcc-browser/qualification
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Build consumer packages
              run: |
                  pnpm --dir packages/core build
                  pnpm --dir packages/llvm-core build
                  pnpm --dir packages/gcc build
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Restore pinned x86 compiler bundles
              run: |
                  mkdir -p "$RUNNER_TEMP/bundles"/{clang,gcc}
                  for compiler in clang gcc; do
                      tar -xJf "x86-producer/test/fixtures/x86-cross/$compiler.tar.xz" -C "$RUNNER_TEMP/bundles/$compiler"
                  done
                  cd "$RUNNER_TEMP/bundles"
                  sha256sum --check <<'PINS'
                  9b2a5471a3664b95562fbff63b0712065f07fc41f594a31f74999ebf53af2942  clang/cross-toolchain.v1.json
                  3170bee5a1a10f8474eab5d5bdeb6802ddb4c34a624804d6d51fbf8c650af86e  gcc/gcc-toolchain.v1.json
                  PINS
            - name: Qualify Clang in Chromium and run the generated ELF programs
              run: |
                  node scripts/verify-x86-cross-clang.mjs "$RUNNER_TEMP/bundles/clang/cross-toolchain.v1.json" "$RUNNER_TEMP/x86-results/clang"
            - name: Qualify GCC in Chromium and run its multi-source and CPU cases
              run: |
                  manifest="$RUNNER_TEMP/bundles/gcc/gcc-toolchain.v1.json"
                  node scripts/verify-x86-cross-gcc.mjs "$manifest" x86-producer/producer/gcc-browser/qualification "$RUNNER_TEMP/x86-results/gcc"
                  node scripts/verify-x86-cross-gcc.mjs "$manifest" packages/gcc/test/multiple-sources "$RUNNER_TEMP/x86-results/gcc-multiple-sources"
                  node scripts/verify-x86-cross-gcc.mjs "$manifest" packages/gcc/test/cpu-profiles "$RUNNER_TEMP/x86-results/gcc-cpu-profiles"
            - name: Keep qualification reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: x86-qualification
                  path: ${{ runner.temp }}/x86-results/*/qualification.json
                  if-no-files-found: ignore
