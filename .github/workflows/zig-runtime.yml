name: Zig 0.17.0 browser runtime

on:
    pull_request:
        paths:
            - .github/workflows/zig-runtime.yml
            - scripts/zig017-browser-smoke.mjs
            - scripts/zig-debug-browser-smoke.mjs
            - scripts/sync-wasm-zig.mjs
            - scripts/wasm-zig-assets.lock.json
            - static/wasm-zig/**
            - src/lib/playground/*zig*
            - src/lib/playground/*Zig*
            - src/lib/playground/worker/zig*
            - src/routes/editor-defaults.ts
            - src/lib/test-fixtures/zig-stdin.zig
            - packages/lsp/src/zig/**
            - packages/debug/src/language/zig.ts
            - packages/llvm-core/runtime/clang/src/runtime.ts
    push:
        branches: [main]
        paths:
            - scripts/zig017-browser-smoke.mjs
            - scripts/zig-debug-browser-smoke.mjs
            - scripts/sync-wasm-zig.mjs
            - scripts/wasm-zig-assets.lock.json
            - static/wasm-zig/**
            - src/lib/playground/*zig*
            - src/lib/playground/*Zig*
            - src/lib/playground/worker/zig*
            - src/routes/editor-defaults.ts
            - src/lib/test-fixtures/zig-stdin.zig
            - packages/lsp/src/zig/**
            - packages/debug/src/language/zig.ts
            - packages/llvm-core/runtime/clang/src/runtime.ts
    workflow_dispatch:

permissions:
    contents: read

jobs:
    chromium:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Compile and run Zig programs in the real browser Worker
              run: pnpm test:zig:browser
            - name: Prepare the pinned LLVM backend and LLDB runtime
              run: |
                  pnpm run prepare:test-assets -- clang
                  pnpm run prepare:wasm-debug-release
            - name: Qualify Zig source debugging in Chromium
              run: node scripts/zig-debug-browser-smoke.mjs
