name: Performance offline test environment
on:
  pull_request:
    paths:
      - '.github/workflows/performance-test-environment.yml'
permissions:
  contents: read
jobs:
  environment:
    if: github.repository == 'seo-rii/wasm-idle' && github.event.pull_request.number == 74
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:publish-deps
      - run: pnpm exec svelte-kit sync
      - run: pnpm run prepare:test-assets -- clang
      - name: Pack only public dependencies, runtime fixtures and generated package files
        run: |
          mkdir -p offline-environment/bin
          cp "$(command -v node)" offline-environment/bin/node
          node --version > offline-environment/node-version.txt
          pnpm --version > offline-environment/pnpm-version.txt
          git rev-parse HEAD > offline-environment/revision.txt
          tar -czf offline-environment/dependencies.tar.gz node_modules packages .svelte-kit static/pyodide static/teavm static/wasm-hy static/clang
          sha256sum offline-environment/dependencies.tar.gz > offline-environment/dependencies.sha256
          printf '%s\n' 'Temporary offline test inputs, not a benchmark or accepted runtime release. No .git directory, credentials, runner environment, or authentication configuration is included. Remove this workflow after diagnosis.' > offline-environment/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: performance-offline-test-environment
          path: offline-environment/
          retention-days: 1
          if-no-files-found: error
