name: Validate parallel Go startup
on:
  push:
    branches: [perf/go-parallel-tool-startup]
    paths: [.github/workflows/validate-go-startup.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/go-parallel-tool-startup
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter wasm-go...
      - run: pnpm --dir runtimes/wasm-go run check
      - run: pnpm --dir runtimes/wasm-go run test
      - name: Rebuild browser JavaScript without rebuilding the Go toolchain
        run: |
          pnpm --dir runtimes/wasm-go run build
          cp -a static/wasm-go/runtime runtimes/wasm-go/dist/runtime
          pnpm --dir runtimes/wasm-go run probe:runtime
          node scripts/sync-wasm-go.mjs
      - name: Verify only Go delivery files changed
        run: |
          git diff --check
          git diff --stat
          git add -- static/wasm-go src/lib/playground/wasmGoVersion.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(go): refresh browser distribution after parallel startup optimization'
            git push origin HEAD:refs/heads/perf/go-parallel-tool-startup
          fi
