name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '17 18 * * *'
    workflow_dispatch:

permissions:
    contents: read

# Only pull request runs share a group. changed-runtimes diffs each push against its own
# `before` commit, so a push run replaced while pending would leave its runtimes untested.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    packages:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      producers/wasm-php/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php build
            - run: pnpm --dir producers/wasm-php verify
            - run: pnpm run verify:wasm-php
            - run: pnpm run verify:page-runtime-freshness
            - run: pnpm run check
            - run: pnpm test
            - run: pnpm run test:page-compiler-assets
            - run: pnpm run test:wasm-debug-release
            - run: pnpm run check:support-matrix
            - run: pnpm run check:asset-sizes
            - run: pnpm run check:packages
            - run: pnpm --dir packages/debug test
            - run: pnpm --dir packages/llvm-core test
            - run: pnpm --dir packages/gcc test
            - run: pnpm --dir packages/lsp test
            - run: pnpm --dir packages/terminal test
            - run: pnpm --dir runtimes/wasm-go test
            - run: pnpm --dir runtimes/wasm-rust exec vitest run test/runtime-pack.test.ts test/runtime-manifest-edge.test.ts
            - run: pnpm exec vitest run --no-file-parallelism --testTimeout=15000 src/lib/sync-*.test.ts
            - run: pnpm exec vitest run src/lib/changed-browser-families.test.ts src/lib/prepare-browser-test-assets.test.ts src/lib/run-all-language-browser-tests.test.ts src/lib/verify-package.test.ts
            - run: pnpm exec vitest run src/lib/compress-static-runtime-assets.test.ts src/lib/static-asset-sizes.test.ts src/lib/build-layered-runtime-assets.test.ts src/lib/compressed-runtime-service-worker.test.ts src/lib/package-scripts.test.ts src/lib/playground/static-runtime-assets.test.ts src/lib/playground/support-matrix.test.ts
            - run: node --test runtimes/wasm-awk/scripts/build.test.mjs
            - run: pnpm --dir packages/llvm-core run verify:package-boundary
            - run: pnpm --dir packages/gcc run verify:package-boundary
            - run: pnpm run verify:package

    workspace-unit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/setup-go@v5
              with:
                  go-version-file: runtimes/wasm-tinygo/go.mod
                  cache-dependency-path: runtimes/wasm-awk/go.sum
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/core build
            - run: pnpm --dir packages/llvm-core build
            - run: pnpm --dir packages/container build
            - run: pnpm exec svelte-kit sync
            - run: node --test scripts/*.test.mjs
              env:
                  WASM_IDLE_SDK_ESBUILD_ROOT: ${{ github.workspace }}/node_modules/esbuild
            - run: node --test runtimes/wasm-scala/src/candidate.test.mjs
            - run: pnpm exec vitest run --root packages/node
            - run: pnpm exec vitest run --root packages/svelte
            - run: pnpm exec vitest run --root packages/vue
            - run: pnpm --dir runtimes/wasm-d test
            - run: pnpm --dir runtimes/wasm-dotnet test
            - run: pnpm --dir runtimes/wasm-lisp test
            - run: pnpm --dir runtimes/wasm-lua test
            - run: pnpm --dir runtimes/wasm-typescript test
            - run: pnpm --dir runtimes/wasm-wat test
            # These five files hold stale assertions that fail on main; the rest of the suite runs.
            - run: >-
                  pnpm --dir runtimes/wasm-rust exec vitest run
                  --exclude test/backend-probes.test.ts
                  --exclude test/ci-script-contract.test.ts
                  --exclude test/compiler-edge-cases.test.ts
                  --exclude test/public-api-types.test.ts
                  --exclude test/rustc-module-service.test.ts
            - run: go test ./...
              working-directory: runtimes/wasm-awk
            - run: go test ./...
              working-directory: runtimes/wasm-tinygo

    gcc-api-contract-fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Seeded API properties and inert asset integrity inputs; no compiler execution.
            - name: Fuzz GCC API boundaries
              env:
                  FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_number || '20261024' }}
              run: pnpm run fuzz:gcc-contract --seed "$FUZZ_SEED" --iterations 10000 --out .cache/gcc-contract-fuzz
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: gcc-api-contract-fuzz
                  path: .cache/gcc-contract-fuzz/report.json
                  if-no-files-found: error
                  retention-days: 7

    gcc-worker-browser-contract:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            # Synthetic host/transport coverage; real GCC qualification runs in the producer CI.
            - run: pnpm run test:browser:gcc-worker-contract
            - name: Validate generated corpus replay gates (synthetic inputs)
              run: node --test scripts/fuzz-x86-cross-gcc.test.mjs

    changed-runtimes:
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            families: ${{ steps.changes.outputs.families }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: node scripts/changed-browser-families.mjs "$BASE_SHA"

    runtime-browser-required:
        needs: changed-runtimes
        if: needs.changed-runtimes.outputs.families != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                family: ${{ fromJSON(needs.changed-runtimes.outputs.families) }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: node scripts/run-all-language-browser-tests.mjs --family=${{ matrix.family }}

    lsp-browser-smoke:
        env:
            WASM_IDLE_REQUIRE_BROWSER_TESTS: '1'
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/core build
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: pnpm run prepare:test-assets -- clangd container
            - run: pnpm --dir packages/lsp exec vitest run test/bundledClangdAssetIntegrity.test.ts
            - run: pnpm run test:lsp:browser:smoke
            - run: pnpm run test:lsp:browser:gleam:csp

    lsp-browser-full:
        env:
            WASM_IDLE_REQUIRE_BROWSER_TESTS: '1'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The distro profile permits /usr/bin/bwrap to prepare Nim's canonical build paths.
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/core build
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Prepare Nim LSP build namespaces
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends bubblewrap
                  /usr/bin/bwrap --version
                  if ! /usr/bin/bwrap --ro-bind / / --proc /proc --dev /dev \
                      --unshare-user --unshare-pid --unshare-ipc --unshare-uts \
                      --die-with-parent /usr/bin/true; then
                      echo '::error::Nim LSP builds require working unprivileged user/mount namespaces.'
                      exit 1
                  fi
            - run: pnpm run prepare:test-assets -- clangd ocaml container
            - name: Build original javacs with the pinned TeaVM toolchain
              run: python3 producers/javacs-teavm/build.py
            - name: Verify and synchronize Java LSP assets
              run: pnpm run sync:java-lsp
            - run: pnpm run test:lsp:browser:full
            - run: pnpm run test:lsp:browser:gleam:csp

    runtime-browser-full:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                shard: [stdin, llvm, workers, specialized, compressed-assets, workspace]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.9.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: node scripts/run-all-language-browser-tests.mjs --shard ${{ matrix.shard }}
