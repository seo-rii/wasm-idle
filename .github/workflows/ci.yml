name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '17 18 * * *'
    workflow_dispatch:

jobs:
    packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      producers/wasm-php/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php build
            - run: pnpm --dir producers/wasm-php verify
            - run: pnpm run verify:wasm-php
            - run: pnpm run check
            - run: node scripts/prepare-clang-compiler-assets.mjs
            - run: pnpm test
            - run: pnpm run check:asset-sizes
            - run: pnpm run check:packages
            - run: pnpm --dir packages/llvm-core test
            - run: node scripts/prepare-clangd-assets.mjs
            - run: pnpm --dir packages/lsp test
            - run: pnpm exec vitest run src/lib/sync-wasm-clang.test.ts src/lib/sync-wasm-d.test.ts src/lib/sync-wasm-rust.test.ts
            - run: pnpm run verify:package

    lsp-browser-smoke:
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: pnpm run prepare:test-assets -- clangd
            - run: pnpm run test:lsp:browser:smoke
            - run: pnpm run test:lsp:browser:gleam:csp

    lsp-browser-full:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: pnpm run prepare:test-assets -- clangd ocaml
            - run: pnpm run test:lsp:browser:full
            - run: pnpm run test:lsp:browser:gleam:csp

    runtime-browser-full:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: stdin
                      asset-group: none
                    - shard: llvm
                      asset-group: clang
                    - shard: workers
                      asset-group: none
                    - shard: specialized
                      asset-group: ocaml
                    - shard: compressed-assets
                      asset-group: all
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - if: matrix.asset-group != 'none'
              run: pnpm run prepare:test-assets -- ${{ matrix.asset-group }}
            - run: node scripts/run-all-language-browser-tests.mjs --shard ${{ matrix.shard }}
