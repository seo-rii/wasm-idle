name: CI

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '17 18 * * *'
    workflow_dispatch:

jobs:
    packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      producers/wasm-php/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php install --frozen-lockfile
            - run: pnpm --dir producers/wasm-php build
            - run: pnpm --dir producers/wasm-php verify
            - run: pnpm run verify:wasm-php
            - run: pnpm run verify:page-runtime-freshness
            - run: pnpm run check
            - run: pnpm test
            - run: pnpm run test:wasm-debug-release
            - run: pnpm run check:support-matrix
            - run: pnpm run check:asset-sizes
            - run: pnpm run check:packages
            - run: pnpm --dir packages/debug test
            - run: pnpm --dir packages/llvm-core test
            - run: pnpm --dir packages/lsp test
            - run: pnpm --dir packages/terminal test
            - run: pnpm --dir runtimes/wasm-go test
            - run: pnpm --dir runtimes/wasm-rust exec vitest run test/runtime-pack.test.ts test/runtime-manifest-edge.test.ts
            - run: pnpm exec vitest run --no-file-parallelism --testTimeout=15000 src/lib/sync-*.test.ts
            - run: pnpm exec vitest run src/lib/prepare-browser-test-assets.test.ts src/lib/run-all-language-browser-tests.test.ts src/lib/verify-package.test.ts
            - run: pnpm exec vitest run src/lib/compress-static-runtime-assets.test.ts src/lib/static-asset-sizes.test.ts src/lib/build-layered-runtime-assets.test.ts src/lib/compressed-runtime-service-worker.test.ts src/lib/package-scripts.test.ts src/lib/playground/static-runtime-assets.test.ts src/lib/playground/support-matrix.test.ts
            - run: node --test runtimes/wasm-awk/scripts/build.test.mjs
            - run: pnpm --dir packages/llvm-core run verify:package-boundary
            - run: pnpm run verify:package

    lsp-browser-smoke:
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: pnpm run prepare:test-assets -- clangd
            - run: pnpm --dir packages/lsp exec vitest run test/bundledClangdAssetIntegrity.test.ts
            - run: pnpm run test:lsp:browser:smoke
            - run: pnpm run test:lsp:browser:gleam:csp

    lsp-browser-full:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - run: pnpm run prepare:test-assets -- clangd ocaml
            - run: pnpm run test:lsp:browser:full
            - run: pnpm run test:lsp:browser:gleam:csp

    runtime-browser-full:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: stdin
                      asset-group: none
                    - shard: llvm
                      asset-group: clang
                    - shard: workers
                      asset-group: none
                    - shard: specialized
                      asset-group: ocaml
                    - shard: compressed-assets
                      asset-group: all
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.30.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright-core install --with-deps chromium
            - if: matrix.asset-group != 'none'
              run: pnpm run prepare:test-assets -- ${{ matrix.asset-group }}
            - run: node scripts/run-all-language-browser-tests.mjs --shard ${{ matrix.shard }}
