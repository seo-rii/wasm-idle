name: PHP final startup and distribution validation
on:
  push:
    branches: [chore/runtime-finish-20260927]
permissions:
  contents: write
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-finish
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute regression tests, real PHP engines and publish verified distribution
        shell: bash
        run: bash .github/runtime-finish/publish-php.sh 2>&1 | tee /tmp/php-final-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-final-validation
          path: /tmp/php-final-validation.log
          retention-days: 1
