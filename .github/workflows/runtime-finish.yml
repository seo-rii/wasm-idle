name: Runtime continuation source and tools
on:
  push:
    branches: [chore/runtime-finish-20260927]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export exact source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/review/{main,ruby,rust,prewarm,helper,tools}
          for pair in main:f85d57670dcadfc60d60b6d31d2088c27dcc3688 ruby:3abecc50d260ceadd00e9626323b5cca5b7b93a1 rust:7ec45071160435a6ae3675bc3cbcf73c8c138e52 prewarm:526c61dab30e08db2bdbf560317716aaec0d1024; do
            name=${pair%%:*}; ref=${pair#*:}
            git fetch --depth=1 origin "$ref"
            git archive "$ref" src packages scripts runtimes producers package.json pnpm-lock.yaml tsconfig.json vite.config.ts | tar -x -C "/tmp/review/$name"
          done
          git fetch --depth=1 origin 53d47605681a07070861889562d406fccd96784a
          git archive 53d47605681a07070861889562d406fccd96784a .github/runtime-followup | tar -x -C /tmp/review/helper
          for ref in f85d57670dcadfc60d60b6d31d2088c27dcc3688 3abecc50d260ceadd00e9626323b5cca5b7b93a1 7ec45071160435a6ae3675bc3cbcf73c8c138e52; do
            git diff --stat f85d57670dcadfc60d60b6d31d2088c27dcc3688 "$ref"
          done
          tar -C /tmp/review --exclude=tools -czf /tmp/runtime-sources.tar.gz .
      - name: Install isolated test and PHP producer dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/review/tools
          printf '{"name":"runtime-review-tools","private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps typescript@5.9.3 vitest@4.1.4 esbuild@0.27.3 prettier@3.8.3 @types/node@24.12.4 @bjorn3/browser_wasi_shim@0.4.2 wabt@1.0.39 buffer@6.0.3 svelte@5.55.4 @php-wasm/universal@3.1.34 @php-wasm/web-8-4@3.1.34
          tar -C /tmp/review/tools -czf /tmp/runtime-tools.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-finish-workspace
          path: |
            /tmp/runtime-sources.tar.gz
            /tmp/runtime-tools.tar.gz
          retention-days: 1
          compression-level: 0
