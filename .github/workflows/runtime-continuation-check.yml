name: Read-only verification of current PHP worker changes
on:
  push:
    branches: [chore/runtime-continuation-1244]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1b7304ef3cfa84638c734959dfeb35dc9ca3581
          persist-credentials: false
          sparse-checkout: |
            src
            packages/core
            scripts
            producers/wasm-php
            static/wasm-php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate current source without reverting concurrent edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-tools
          printf '{"private":true,"type":"module"}' > /tmp/test-tools/package.json
          bundler=$(node -p "require('./package.json').devDependencies.esbuild || ''")
          test -n "$bundler"
          (cd /tmp/test-tools && npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund typescript@5.9.3 vitest@4.1.4 "esbuild@$bundler" @types/node@24.12.4 @bjorn3/browser_wasi_shim@0.4.2 playwright-core@1.59.1)
          ln -s /tmp/test-tools/node_modules node_modules
          mkdir -p .svelte-kit
          printf '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"bundler"}}' > .svelte-kit/tsconfig.json
          printf 'export const env={};' > /tmp/empty-env.mjs
          printf 'globalThis.window={location:new URL("http://localhost:3000/")};globalThis.history={replaceState(_a,_b,url){window.location=new URL(url,window.location);}};' > /tmp/setup.mjs
          cat > /tmp/php-config.mjs <<'JS'
          import path from 'node:path';
          const root=process.cwd();
          export default {
            resolve:{alias:{'@wasm-idle/core':path.join(root,'packages/core/src/index.ts'),'$lib':path.join(root,'src/lib'),'$env/dynamic/public':'/tmp/empty-env.mjs'}},
            test:{environment:'node',include:['src/lib/playground/php*.test.ts','src/lib/playground/worker/php*.test.ts','src/lib/php-startup-loader.test.ts'],exclude:['**/*.playwright.test.ts'],testTimeout:30000,setupFiles:['/tmp/setup.mjs']}
          };
          JS
          node /tmp/test-tools/node_modules/vitest/vitest.mjs run --config /tmp/php-config.mjs --reporter=verbose | tee /tmp/php-current-tests.log
          node scripts/probe-php-startup-retry.mjs | tee /tmp/php-current-browser.log
          git diff --exit-code
          git rev-parse HEAD | tee /tmp/verified-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-current-verification
          path: |
            /tmp/php-current-tests.log
            /tmp/php-current-browser.log
            /tmp/verified-head.txt
          retention-days: 1
