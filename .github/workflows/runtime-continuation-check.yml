name: Reproducible Ruby and PHP browser worker probes
on:
  push:
    branches: [chore/runtime-continuation-1244]
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ruby
            base: 502b64932eabf48aa08339e6357e8f24549e88c1
            branch: perf/ruby-initialized-vm-prewarm
          - language: php
            base: 51541b1b0cec14512fdfb92ce5700590d72f018f
            branch: perf/php-verified-parallel-startup
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/runtime-continuation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test native engines with Vite-built workers before publishing
        env:
          LANGUAGE: ${{ matrix.language }}
          BASE: ${{ matrix.base }}
          BRANCH: ${{ matrix.branch }}
        shell: bash
        run: bash .github/runtime-continuation/validate-probe-deps.sh 2>&1 | tee /tmp/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vite-worker-${{ matrix.language }}-validation
          path: |
            /tmp/validation.log
            /tmp/published-head.txt
          retention-days: 1
