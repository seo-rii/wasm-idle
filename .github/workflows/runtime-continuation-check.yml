name: Scoped runtime continuation snapshots
on:
  push:
    branches: [chore/runtime-continuation-1244]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Archive exact source revisions and existing Ruby fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/snapshots
          for pair in main:1c319a537c416ee87dc0e36a862706a2a2ae6c8c php:1e77b741bd4b5658bd84853718b5b1b3f9c8bc25 dotnet:32e47aa97fd2875896a4ec8abf38924ed3ea4c0c rust:7ec45071160435a6ae3675bc3cbcf73c8c138e52; do
            name=${pair%%:*}; ref=${pair#*:}
            git fetch --depth=1 origin "$ref"
            mkdir -p "/tmp/snapshots/$name"
            git archive "$ref" src packages scripts runtimes producers package.json pnpm-lock.yaml tsconfig.json vite.config.ts | tar -x -C "/tmp/snapshots/$name"
            printf '%s\n' "$ref" > "/tmp/snapshots/$name/COMMIT.txt"
          done
          git archive 1c319a537c416ee87dc0e36a862706a2a2ae6c8c static/wasm-ruby | tar -x -C /tmp/snapshots/main
          git archive 7ec45071160435a6ae3675bc3cbcf73c8c138e52 static/wasm-rust/runtime/runtime-manifest.v3.json | tar -x -C /tmp/snapshots/rust
          tar -C /tmp/snapshots -czf /tmp/runtime-exact-sources.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-exact-sources
          path: /tmp/runtime-exact-sources.tar.gz
          compression-level: 0
          retention-days: 1
