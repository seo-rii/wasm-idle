[package]
name = "wasm-idle-uiua"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
uiua = { version = "=0.19.1", default-features = false, features = ["native_sys"] }

[patch.crates-io]
uiua = { path = ".cache/uiua-0.19.1" }

[profile.release]
opt-level = "s"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1
